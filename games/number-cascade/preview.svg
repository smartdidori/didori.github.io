<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="activeTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sumTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ncBg)"/>

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Puzzle Board on Right -->
  <g transform="translate(450, 65)" filter="url(#shadow)">
    <!-- Board Base -->
    <rect width="300" height="300" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Sudoku Grid (3x3 big blocks) -->
    <rect x="10" y="10" width="280" height="280" rx="10" fill="#1e293b"/>

    <!-- Grid cells & sample numbers (4x4 display slice) -->
    <!-- Row 1 -->
    <rect x="20" y="20" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="50" y="60" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">2</text>

    <rect x="86" y="20" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="116" y="60" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">9</text>

    <rect x="154" y="20" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="184" y="60" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#94a3b8" text-anchor="middle">4</text>

    <rect x="220" y="20" width="60" height="60" rx="8" fill="#334155" opacity="0.4"/>

    <!-- Row 2: Target Sum Zone (12) -->
    <rect x="18" y="84" width="130" height="64" rx="10" fill="rgba(14, 165, 233, 0.12)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="26" y="98" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Σ 12</text>

    <rect x="20" y="86" width="60" height="60" rx="8" fill="url(#activeTile)"/>
    <text x="50" y="126" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>

    <rect x="86" y="86" width="60" height="60" rx="8" fill="#0284c7" opacity="0.9"/>
    <text x="116" y="126" font-family="'Pretendard', sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>

    <!-- Cascade Chain Link between 7 and 5 -->
    <rect x="74" y="108" width="18" height="16" rx="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="83" cy="116" r="3" fill="#ffffff"/>

    <rect x="154" y="86" width="60" height="60" rx="8" fill="#334155" opacity="0.5"/>
    <rect x="220" y="86" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="250" y="126" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">1</text>

    <!-- Row 3 -->
    <rect x="20" y="152" width="60" height="60" rx="8" fill="#334155" opacity="0.5"/>

    <rect x="86" y="152" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="116" y="192" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#94a3b8" text-anchor="middle">6</text>

    <rect x="154" y="152" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="184" y="192" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">3</text>

    <rect x="220" y="152" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="250" y="192" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">8</text>

    <!-- Row 4 -->
    <rect x="20" y="218" width="60" height="60" rx="8" fill="#334155" opacity="0.7"/>
    <text x="50" y="258" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">4</text>
    <rect x="86" y="218" width="60" height="60" rx="8" fill="#334155" opacity="0.5"/>
    <rect x="154" y="218" width="60" height="60" rx="8" fill="#334155" opacity="0.5"/>
    <rect x="220" y="218" width="60" height="60" rx="8" fill="#334155" opacity="0.5"/>
  </g>

  <!-- Left Side: Title & Info -->
  <g transform="translate(65, 85)">
    <!-- Badges -->
    <g transform="translate(0, 0)">
      <rect width="90" height="30" rx="15" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="4" fill="#34d399"/>
      <text x="28" y="20" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" letter-spacing="1">NEW</text>
    </g>

    <g transform="translate(102, 0)">
      <rect width="145" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="72" y="20" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">SUDOKU CASCADE</text>
    </g>

    <!-- Title Heading -->
    <text x="0" y="95" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
      숫자 연쇄
    </text>
    <text x="0" y="140" font-family="'Pretendard', sans-serif" font-size="24" font-weight="600" fill="#38bdf8" letter-spacing="1">
      Number Cascade
    </text>

    <!-- Description -->
    <text x="0" y="185" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" line-height="1.6">
      <tspan x="0" dy="0">수도쿠의 빈칸을 연쇄와 목표 합계로 좁혀라!</tspan>
      <tspan x="0" dy="24">논리적 사고와 추론의 즐거움을 담은 정통 9×9 숫자 퍼즐</tspan>
    </text>

    <!-- Features Pill -->
    <g transform="translate(0, 245)">
      <rect width="345" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="16" y="23" font-family="'Pretendard', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
        ▦ 9×9 수도쿠  ·  🔗 인접 연쇄  ·  🎯 목표 합계  ·  📅 오늘의 퍼즐
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="442" width="800" height="8" fill="url(#sumTile)"/>
</svg>
