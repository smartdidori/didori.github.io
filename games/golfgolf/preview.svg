<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e8d4"/>
      <stop offset="60%" stop-color="#eaf4e5"/>
      <stop offset="100%" stop-color="#f5f9f0"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fc28e"/>
      <stop offset="100%" stop-color="#7ca76b"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8b50"/>
      <stop offset="100%" stop-color="#3b6b33"/>
    </linearGradient>
    <linearGradient id="greenArea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7e4e"/>
      <stop offset="100%" stop-color="#215731"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="580" cy="110" r="50" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="580" cy="110" r="65" fill="#fff9c4" opacity="0.3"/>

  <!-- Distant Hills -->
  <ellipse cx="200" cy="380" rx="420" ry="200" fill="url(#hill1)" opacity="0.85"/>
  <ellipse cx="650" cy="400" rx="380" ry="180" fill="#8cb57b" opacity="0.7"/>

  <!-- Near Hills / Fairway -->
  <ellipse cx="400" cy="480" rx="550" ry="220" fill="url(#hill2)"/>
  <ellipse cx="480" cy="370" rx="260" ry="90" fill="url(#greenArea)" transform="rotate(-4 480 370)"/>

  <!-- Putting Green Hole & Flag -->
  <ellipse cx="520" cy="360" rx="14" ry="7" fill="#143b20"/>
  <!-- Pin pole -->
  <line x1="520" y1="360" x2="520" y2="230" stroke="#f1f5ec" stroke-width="4" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="520,230 460,250 520,270" fill="#dc2626"/>
  <text x="495" y="256" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">18</text>

  <!-- Golf Ball & Tee -->
  <circle cx="340" cy="365" r="9" fill="#ffffff" filter="url(#shadow)"/>
  <ellipse cx="342" cy="374" rx="7" ry="2.5" fill="#1b4324" opacity="0.4"/>

  <!-- Overlay Vignette & Title Banner -->
  <rect x="0" y="0" width="800" height="450" fill="black" opacity="0.12"/>

  <!-- Badge / Tag -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="17" fill="rgba(23, 59, 48, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#22c55e"/>
    <text x="35" y="22" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#d9ec9e" letter-spacing="1">BOOKING TYCOON</text>
  </g>

  <!-- Title Text -->
  <text x="60" y="150" font-family="'Pretendard', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#173b30" letter-spacing="-1.5">골프골프</text>
  <text x="250" y="150" font-family="'Pretendard', -apple-system, sans-serif" font-size="28" font-weight="600" fill="#3b6b33" letter-spacing="2">· 부킹 매니저</text>

  <text x="60" y="190" font-family="'Pretendard', -apple-system, sans-serif" font-size="19" font-weight="500" fill="#476544">한 칸의 선택, 하루의 승부! 티타임 예약 경영 시뮬레이션</text>

  <!-- Bottom Strip -->
  <rect x="0" y="420" width="800" height="30" fill="rgba(15, 35, 26, 0.9)"/>
  <text x="400" y="440" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#c8d8a8" text-anchor="middle" letter-spacing="3">18 HOLES · 5-DAY SEASON · STRATEGY &amp; TYCOON</text>
</svg>
